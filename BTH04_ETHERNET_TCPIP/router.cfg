enable
configure terminal
hostname R-IOT
interface GigabitEthernet0/0
 description WAN_TO_HOME_ROUTER
 ip address 10.1.1.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/1
 description IOT_SERVER_LAN
 ip address 10.1.2.1 255.255.255.0
 no shutdown
exit
end
write memory
show ip interface brief
show ip route
