# ESP32-S3 DevKitC-1 - ESPHome + Home Assistant
# Thông tin bí mật được đặt trong secrets.yaml và không commit lên GitHub.

esphome:
  name: esp32-s3-devkitc1
  friendly_name: ESP32-S3 DevKitC-1

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino
  flash_mode: dio
  flash_frequency: 40MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "ESP32-S3 Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

light:
  - platform: esp32_rmt_led_strip
    name: "Onboard RGB"
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

