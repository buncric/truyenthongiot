esphome:
  name: espdevkit1
  friendly_name: ESP DevKit 1

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Espdevkit1 Fallback
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

light:
  - platform: esp32_rmt_led_strip
    name: Onboard RGB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
