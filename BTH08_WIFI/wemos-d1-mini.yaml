esphome:
  name: wemos-d1
  friendly_name: Wemos D1
esp8266:
  board: d1_mini
logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Wemos-D1-Fallback
    password: !secret fallback_password
captive_portal:
web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
output:
  - platform: gpio
    pin:
      number: D4
      inverted: true
    id: onboard_led
light:
  - platform: binary
    name: Wemos LED
    output: onboard_led
sensor:
  - platform: dht
    pin: D2
    model: DHT11
    temperature:
      name: Temperature
    humidity:
      name: Humidity
    update_interval: 10s
